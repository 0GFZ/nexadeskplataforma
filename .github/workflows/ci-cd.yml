name: CI-CD NexaDesk

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {contents: read, packages: write}

env:
  IMAGE: ghcr.io/0gfz/nexadeskplataforma

jobs:
  pipeline:
    name: Teste, build e entrega
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}

      - name: Testar aplicação
        run: |
          node --check src/app.js
          MODE=api node src/app.js & PID=$!
          trap "kill $PID" EXIT
          sleep 2
          curl --fail http://localhost:3000/health

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push e manifesto
        run: |
          TAG=staging
          MANIFEST=environments/staging/deploy.yaml
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=production
            MANIFEST=environments/prod/deploy.yaml
          fi
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$TAG"
          mkdir artefato
          sed -E "s|image: nexadesk/app:[^[:space:]]+|image: $IMAGE:$GITHUB_SHA|g" \
            "$MANIFEST" > artefato/deploy.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: manifesto-${{ github.ref_name }}
          path: artefato/
