apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: nexadesk-api
        static_configs:
          - targets: ["api.nexadesk-staging.svc.cluster.local:3000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: NexaDesk
        type: file
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
    {"annotations":{"list":[]},"editable":true,"panels":[{"id":1,"type":"stat","title":"API online","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"up{job=\"nexadesk-api\"}","refId":"A"}],"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"OFF"},"1":{"text":"ON"}}}]},"overrides":[]},"options":{"colorMode":"value","graphMode":"none","reduceOptions":{"calcs":["lastNotNull"]}},"gridPos":{"h":8,"w":8,"x":0,"y":0}},{"id":2,"type":"stat","title":"Requisições","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"http_requests_total","refId":"A"}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},"gridPos":{"h":8,"w":8,"x":8,"y":0}},{"id":3,"type":"stat","title":"Erros","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"http_errors_total","refId":"A"}],"fieldConfig":{"defaults":{},"overrides":[]},"options":{"colorMode":"value","graphMode":"area","reduceOptions":{"calcs":["lastNotNull"]}},"gridPos":{"h":8,"w":8,"x":16,"y":0}}],"refresh":"5s","schemaVersion":39,"tags":["devops","nexadesk"],"time":{"from":"now-15m","to":"now"},"timezone":"America/Fortaleza","title":"NexaDesk - Brasil (UTC-3)","uid":"nexadesk","version":1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports: [{containerPort: 3000}]
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_DATE_FORMATS_DEFAULT_TIMEZONE, value: America/Fortaleza}
          volumeMounts:
            - {name: config, subPath: datasource.yml, mountPath: /etc/grafana/provisioning/datasources/default.yml}
            - {name: config, subPath: dashboards.yml, mountPath: /etc/grafana/provisioning/dashboards/default.yml}
            - {name: config, subPath: dashboard.json, mountPath: /var/lib/grafana/dashboards/dashboard.json}
      volumes:
        - name: config
          configMap: {name: grafana-config}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
