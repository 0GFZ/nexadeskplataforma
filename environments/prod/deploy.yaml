# O namespace 'nexadesk-prod' já foi criado previamente via IaC/Terraform.
# Isso evita erros de validação no VS Code e segue boas práticas de GitOps.
---
# 1. Secret Seguro: Senhas não ficam expostas no código do Deploy
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: nexadesk-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@db-externo:5432/nexadesk"

---
# 2. Deployment API: Backend com limites de recursos definidos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nexadesk-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nexadesk/app:v1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: MODE
              value: "api"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL
          # ✅ RESOLVE OS WARNINGS: Evita "noisy neighbor" e garante estabilidade
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5

---
# 3. Service API: Comunicação interna segura
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: nexadesk-prod
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000

---
# 4. Deployment Frontend: Interface com recursos limitados
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexadesk-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nexadesk/app:v1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: MODE
              value: "frontend"
          # ✅ RESOLVE OS WARNINGS: Mesma padronização de recursos
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# 5. Service Frontend: Exposto via NodePort para acesso externo
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: nexadesk-prod
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30082