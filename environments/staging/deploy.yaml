# O namespace 'nexadesk-staging' já foi criado previamente via IaC/Terraform.
---
# 1. Secret Staging (Dados de teste separados da produção)
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: nexadesk-staging
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@db-externo:5432/nexadesk_staging"

---
# 2. Deployment API Staging (Replica única para economia de recursos)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nexadesk-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nexadesk/app:staging
          ports:
            - containerPort: 3000
          env:
            - name: MODE
              value: "api"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL
          # ✅ RESOLVE WARNINGS: Limites definidos para staging
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5

---
# 3. Service API Staging
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: nexadesk-staging
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000

---
# 4. Deployment Worker Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexadesk-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: nexadesk/app:staging
          env:
            - name: MODE
              value: "worker"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL
          # ✅ RESOLVE WARNINGS: Worker também precisa de limites
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# 5. Deployment Frontend Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexadesk-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nexadesk/app:staging
          ports:
            - containerPort: 3000
          env:
            - name: MODE
              value: "frontend"
          # ✅ RESOLVE WARNINGS: Frontend com limites padronizados
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5

---
# 6. Service Frontend Staging (NodePort diferente da prod: 30080)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: nexadesk-staging
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080