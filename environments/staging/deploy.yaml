apiVersion: v1
kind: Namespace
metadata:
  name: nexadesk-staging
---
apiVersion: v1
kind: Secret
metadata:
  name: database
  namespace: nexadesk-staging
type: Opaque
stringData:
  DATABASE_URL: "postgresql://usuario:senha@banco-externo:5432/nexadesk"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nexadesk-staging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: nexadesk/app:staging
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODE, value: api}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: database, key: DATABASE_URL}
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nexadesk-staging
spec:
  selector: {app: api}
  ports: [{port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexadesk-staging
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: nexadesk/app:staging
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODE, value: worker}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: database, key: DATABASE_URL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexadesk-staging
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: nexadesk/app:staging
          imagePullPolicy: IfNotPresent
          env: [{name: MODE, value: frontend}]
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nexadesk-staging
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - {port: 80, targetPort: 3000, nodePort: 30080}
